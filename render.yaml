services:
  - type: web
    name: public-https-incident-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MODEL_NAME
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
